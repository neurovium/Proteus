id: https://w3id.org/proteus/meta-model
name: proteus_meta_model
title: PROTEUS Meta-Model
description: >-
  Meta-model for PROTEUS (Provenance-Rich Ontology-agnostic Typed Entity
  Unification System): a federated schema registry and mapping commons.

  DESIGN PRINCIPLES
  1. Content-addressed, immutable definitional entities. hash_id is derived
     from an entity's *definitional content only* (name, definition,
     structure, value typing) — never from annotations. "Modification" is
     the creation of a new entity linked via provenance.derived_from.
     There are therefore no modified_by/modified_at slots.
  2. Strict separation of DEFINITIONAL content (inside the hashed entity)
     from EPISTEMIC annotations (Mapping records, review status), which
     live outside all entities and reference them by hash_id. Adding or
     retracting a mapping never changes any entity's identity.
  3. Mappings are SSSOM-conformant. Slot names and URIs follow the SSSOM
     specification (sssom-schema); records exported from this model are
     valid SSSOM and can round-trip through sssom-py. The registry adds
     one local extension (review_status) for the curation lifecycle.
  4. Source schemas are first-class. Every registered entity is anchored
     to a SourceSchemaVersion; the hub/bridge vocabulary is itself just a
     registered schema, so schema->hub and schema->schema mappings are
     structurally identical.

#------License-------
# We can also choose MIT License (TBD)
license: https://creativecommons.org/publicdomain/zero/1.0/

#-----Prefixes-------
prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#
  dcterms: http://purl.org/dc/terms/
  pav: http://purl.org/pav/
  sssom: https://w3id.org/sssom/
  semapv: https://w3id.org/semapv/vocab/
  qudt: http://qudt.org/schema/qudt/
  owl: http://www.w3.org/2002/07/owl#
  proteus: https://w3id.org/proteus/meta-model/

default_prefix: proteus
default_range: string

imports:
  - linkml:types

# ===========================================================================
# CLASSES
# ===========================================================================
classes:

  # -------------------------------------------------------------------------
  # Registry backbone: the schemas being registered
  # -------------------------------------------------------------------------

  SourceSchema:
    class_uri: proteus:SourceSchema
    description: >-
      A schema as a social/publishing artifact, independent of version:
      who maintains it, where it lives. The hub/bridge vocabulary is
      registered as a SourceSchema like any other, distinguished only by
      is_hub = true.
    slots:
      - id
      - title
      - publisher
      - contact
      - homepage
      - is_hub

  SourceSchemaVersion:
    class_uri: proteus:SourceSchemaVersion
    description: >-
      An immutable, registered version of a SourceSchema. Each version is
      the anchor (and natural named-graph partition) for the registry
      entities extracted from it.
    slots:
      - version_iri
      - of_schema
      - version_label
      - source_format
      - namespace
      - issued
      - prior_version
      - artifact_hash

  # -------------------------------------------------------------------------
  # Definitional entities (content-addressed, immutable)
  # -------------------------------------------------------------------------

  RegistryEntity:
    abstract: true
    class_uri: proteus:RegistryEntity
    description: >-
      Common base for content-addressed, immutable, provenance-tracked
      definitional objects. hash_id is computed over a canonical
      serialization of the entity's definitional slots ONLY (everything
      here except provenance). Mappings and other epistemic annotations
      are NOT part of any entity: they are standalone records referencing
      hash_ids, so annotating an entity never changes its identity.
    slots:
      - hash_id
      - name
      - source_native_id
      - aliases
      - definition
      - comments
      - defined_in
      - provenance

  RegistryClass:
    is_a: RegistryEntity
    class_uri: proteus:RegistryClass
    description: >-
      A registered class (object type / concept), e.g. "SpectroscopicObservation".
      Which properties it carries, and with what local constraints, is
      expressed via slot_assignments (an association object), so that the
      same RegistryProperty can be reused across classes with different
      cardinality or requiredness.
    slots:
      - slot_assignments
      - parent_class
      - mixins
      - relations

  RegistryProperty:
    is_a: RegistryEntity
    class_uri: proteus:RegistryProperty
    description: >-
      A registered property (data element / attribute), e.g. "z_spec".
      Typing is structured: value_type is an XSD datatype CURIE or the
      hash_id of a ValueSet; unit is a structured Unit object resolvable
      to QUDT/UCUM. Both are load-bearing for alignment (datatype and
      unit compatibility checks).
    slots:
      - value_type
      - unit

  ValueSet:
    is_a: RegistryEntity
    class_uri: proteus:ValueSet
    description: >-
      A controlled set of permissible values, usable as a
      RegistryProperty value_type (referenced by hash_id).
    slots:
      - permissible_values

  PermissibleValue:
    class_uri: proteus:PermissibleValue
    description: One allowed value within a ValueSet.
    slots:
      - text
      - value_meaning
      - value_definition

  SlotAssignment:
    class_uri: proteus:SlotAssignment
    description: >-
      Association object attaching a RegistryProperty to a RegistryClass
      with class-local constraints (this replaces most of what a generic
      "Rule" stub would do). Part of the class's definitional content:
      changing an assignment legitimately produces a new class hash_id.
    slots:
      - property
      - required
      - multivalued
      - minimum_cardinality
      - maximum_cardinality
      - constraint_expression

  Unit:
    class_uri: proteus:Unit
    description: >-
      Structured unit of measure. At least one of qudt_unit or ucum_code
      should be provided; label is for display only.
    slots:
      - unit_label
      - qudt_unit
      - ucum_code

  Relation:
    class_uri: proteus:Relation
    description: >-
      A DEFINITIONAL directed relationship asserted by the source schema
      itself (e.g. Detector isPartOf Instrument). Because it is part of
      what the source schema says, it may be embedded in the subject
      class's definition and participate in its hash. Cross-schema
      similarity claims do NOT belong here — those are epistemic and go
      in Mapping.
    slots:
      - predicate
      - object_entity
      - relation_provenance

  # -------------------------------------------------------------------------
  # Epistemic annotations: the mapping layer (SSSOM-conformant)
  # -------------------------------------------------------------------------

  Mapping:
    class_uri: proteus:Mapping
    description: >-
      A single semantic mapping between two entities, SSSOM-conformant.
      Subject and object are CURIEs/IRIs: registry hash_ids for
      schema<->schema and schema<->hub mappings, or external vocabulary
      IRIs for outward mappings — one uniform record type for all three
      cases. Standalone by design (never embedded in an entity), so
      proposing, accepting, or retracting mappings never perturbs
      content-addressed identity.
    slots:
      - mapping_id
      - subject_id
      - subject_label
      - predicate_id
      - object_id
      - object_label
      - mapping_justification
      - confidence
      - mapping_tool
      - match_string
      - author_id
      - reviewer_id
      - mapping_date
      - review_status
      - mapping_comment

  MappingSet:
    class_uri: proteus:MappingSet
    description: >-
      A named collection of Mapping records sharing provenance — e.g. one
      run of a matcher over a schema pair, or one curation campaign. Maps
      onto an SSSOM mapping set (and a named graph in the store).
    slots:
      - mapping_set_id
      - mapping_set_description
      - mappings
      - mapping_provider
      - mapping_set_license

  # -------------------------------------------------------------------------
  # Provenance
  # -------------------------------------------------------------------------

  ProvenanceInfo:
    class_uri: proteus:ProvenanceInfo
    description: >-
      Creation and derivation provenance for an immutable entity. No
      modification slots by design: a "modified" entity is a new entity
      whose derived_from points at its predecessor(s).
    slots:
      - created_by
      - created_at
      - derived_from
      - method

# ===========================================================================
# SLOTS
# ===========================================================================
slots:

  # --- identifiers ---------------------------------------------------------
  id:
    identifier: true
    range: uriorcurie
    description: Stable identifier for a SourceSchema (not content-addressed).

  version_iri:
    identifier: true
    range: uriorcurie
    description: >-
      Immutable IRI for this exact schema version (e.g. minted per
      registration; may incorporate artifact_hash).

  hash_id:
    identifier: true
    required: true
    range: uriorcurie
    description: >-
      Content-hash-derived CURIE for this entity, computed over a
      canonical serialization of definitional slots only. Recommended
      form: proteus:sha256-<hex>.

  mapping_id:
    identifier: true
    required: true
    range: uriorcurie
    description: Identifier for this mapping record.

  mapping_set_id:
    identifier: true
    required: true
    range: uriorcurie
    description: Identifier for this mapping set.

  # --- SourceSchema / SourceSchemaVersion ---------------------------------
  title:
    required: true
    description: Human-readable title of the schema.

  publisher:
    description: Organization or group that maintains the schema.

  contact:
    description: Contact point for the schema (person, list, or URL).

  homepage:
    range: uri
    description: Documentation or landing page for the schema.

  is_hub:
    range: boolean
    description: >-
      True if this schema is (part of) the registry's core/bridge
      vocabulary that other schemas anchor to.

  of_schema:
    required: true
    range: SourceSchema
    inlined: false
    description: The SourceSchema this version belongs to.

  version_label:
    description: Human-readable version designation (e.g. "2.1", "2026-07").

  source_format:
    range: SourceFormatEnum
    description: The native format the schema was authored/ingested in.

  namespace:
    range: uri
    description: Base namespace/prefix expansion used by this schema version.

  issued:
    range: datetime
    slot_uri: dcterms:issued
    description: When this version was released or registered.

  prior_version:
    range: SourceSchemaVersion
    inlined: false
    slot_uri: pav:previousVersion
    description: The immediately preceding registered version, if any.

  artifact_hash:
    description: >-
      Checksum of the ingested source artifact (e.g. sha256 of the file),
      for integrity and deduplication.

  # --- RegistryEntity core -------------------------------------------------
  name:
    required: true
    slot_uri: skos:prefLabel
    description: Preferred human-readable label for this entity.

  source_native_id:
    description: >-
      The verbatim identifier of this element in its source schema (e.g.
      the raw column/field name "z_spec"). Preserve exactly; lexical
      matchers depend on it.

  aliases:
    multivalued: true
    slot_uri: skos:altLabel
    description: Alternative labels, synonyms, abbreviations.

  definition:
    required: true
    slot_uri: skos:definition
    description: >-
      Human-readable definition. Required, and worth enforcing seriously:
      definitions are primary evidence for embedding-based alignment.

  comments:
    multivalued: true
    slot_uri: skos:note
    description: Additional notes, scope statements, editorial remarks.

  defined_in:
    required: true
    range: SourceSchemaVersion
    inlined: false
    description: >-
      The exact schema version this entity was extracted from. Anchors
      the entity to a named graph and makes cross-version diffing possible.

  provenance:
    required: true
    range: ProvenanceInfo
    inlined: true
    description: Creation/derivation provenance for this entity.

  # --- RegistryClass structure --------------------------------------------
  slot_assignments:
    multivalued: true
    range: SlotAssignment
    inlined: true
    inlined_as_list: true
    description: Properties attached to this class, with local constraints.

  parent_class:
    range: RegistryClass
    inlined: false
    description: The class this class specializes (single inheritance).

  mixins:
    multivalued: true
    range: RegistryClass
    inlined: false
    description: Additional classes mixed into this class.

  relations:
    multivalued: true
    range: Relation
    inlined: true
    inlined_as_list: true
    description: Definitional relations from this class to other entities.

  # --- SlotAssignment ------------------------------------------------------
  property:
    required: true
    range: RegistryProperty
    inlined: false
    description: The property being attached to the class.

  required:
    range: boolean
    description: Whether the property is mandatory on this class.

  multivalued:
    range: boolean
    description: Whether the property may have multiple values on this class.

  minimum_cardinality:
    range: integer
    description: Minimum number of values, if constrained.

  maximum_cardinality:
    range: integer
    description: Maximum number of values, if constrained.

  constraint_expression:
    description: >-
      Optional machine-evaluable constraint (e.g. a pattern or numeric
      range expression) applying to this property on this class.

  # --- RegistryProperty typing --------------------------------------------
  value_type:
    required: true
    range: uriorcurie
    description: >-
      An XSD datatype CURIE (e.g. xsd:float, xsd:string) or the hash_id
      of a ValueSet for enumerated values. Structured on purpose:
      datatype compatibility is an alignment signal and incompatibility
      a veto.

  unit:
    range: Unit
    inlined: true
    description: Structured unit of measure, if applicable.

  unit_label:
    description: Display label for the unit (e.g. "deg", "km/s/Mpc").

  qudt_unit:
    range: uriorcurie
    description: QUDT unit IRI (e.g. unit:DEG), enabling convertibility checks.

  ucum_code:
    description: UCUM code for the unit (e.g. "deg", "km.s-1.Mpc-1").

  # --- ValueSet ------------------------------------------------------------
  permissible_values:
    multivalued: true
    range: PermissibleValue
    inlined: true
    inlined_as_list: true
    description: The allowed values in this value set.

  text:
    required: true
    description: The literal value as it appears in data.

  value_meaning:
    range: uriorcurie
    description: External concept this value denotes, if known.

  value_definition:
    description: Human-readable definition of this value.

  # --- Relation ------------------------------------------------------------
  predicate:
    required: true
    range: uriorcurie
    description: >-
      Relation type as a CURIE (e.g. a hub-vocabulary or external
      predicate). CURIE rather than free text so relations are queryable.

  object_entity:
    required: true
    range: RegistryEntity
    inlined: false
    description: The entity the relation points to.

  relation_provenance:
    range: ProvenanceInfo
    inlined: true
    description: Provenance of this relation assertion.

  # --- Mapping (SSSOM-conformant) -----------------------------------------
  subject_id:
    required: true
    range: uriorcurie
    slot_uri: sssom:subject_id
    description: CURIE of the mapping subject (registry hash_id or external IRI).

  subject_label:
    slot_uri: sssom:subject_label
    description: Label of the subject at mapping time (denormalized for review).

  predicate_id:
    required: true
    range: MappingPredicateEnum
    slot_uri: sssom:predicate_id
    description: The mapping relation.

  object_id:
    required: true
    range: uriorcurie
    slot_uri: sssom:object_id
    description: CURIE of the mapping object (registry hash_id or external IRI).

  object_label:
    slot_uri: sssom:object_label
    description: Label of the object at mapping time (denormalized for review).

  mapping_justification:
    required: true
    range: MappingJustificationEnum
    slot_uri: sssom:mapping_justification
    description: The semapv process that produced this mapping.

  confidence:
    range: float
    minimum_value: 0.0
    maximum_value: 1.0
    slot_uri: sssom:confidence
    description: Score in [0,1] assigned by the producing process.

  mapping_tool:
    slot_uri: sssom:mapping_tool
    description: Name/version of the matcher that proposed this mapping.

  match_string:
    multivalued: true
    slot_uri: sssom:match_string
    description: The strings/evidence on which the match was made.

  author_id:
    range: uriorcurie
    slot_uri: sssom:author_id
    description: Agent responsible for creating the mapping.

  reviewer_id:
    range: uriorcurie
    slot_uri: sssom:reviewer_id
    description: Agent who reviewed the mapping, once curated.

  mapping_date:
    range: date
    slot_uri: sssom:mapping_date
    description: Date the mapping was asserted.

  review_status:
    range: ReviewStatusEnum
    description: >-
      REGISTRY EXTENSION (proteus, not sssom): lifecycle state of this
      mapping in the curation workflow. Queries choose their rigor by
      filtering on this together with predicate_id and confidence.

  mapping_comment:
    slot_uri: sssom:comment
    description: Free-text note on this mapping.

  # --- MappingSet ----------------------------------------------------------
  mapping_set_description:
    slot_uri: dcterms:description
    description: What this mapping set contains and why it exists.

  mappings:
    multivalued: true
    range: Mapping
    inlined: true
    inlined_as_list: true
    description: The mapping records in this set.

  mapping_provider:
    range: uri
    slot_uri: sssom:mapping_provider
    description: URL of the party or pipeline providing this set.

  mapping_set_license:
    range: uri
    slot_uri: dcterms:license
    description: License under which this mapping set is distributed.

  # --- ProvenanceInfo ------------------------------------------------------
  created_by:
    required: true
    slot_uri: pav:createdBy
    description: Agent (person or pipeline) that created this entity.

  created_at:
    required: true
    range: datetime
    slot_uri: pav:createdOn
    description: Creation timestamp.

  derived_from:
    multivalued: true
    range: uriorcurie
    slot_uri: prov:wasDerivedFrom
    description: >-
      hash_ids of predecessor entities. This is the versioning mechanism:
      an edited entity is a new hash_id derived_from the old one.

  method:
    description: How this entity was produced (free text or pipeline ref).

# ===========================================================================
# ENUMS
# ===========================================================================
enums:

  MappingPredicateEnum:
    description: >-
      Allowed mapping relations. SKOS graded vocabulary plus
      owl:equivalentClass for the strict-logical case. Direction
      convention follows SKOS: subject broadMatch object means the
      OBJECT is the broader concept.
    permissible_values:
      EXACT_MATCH:
        meaning: skos:exactMatch
        description: Subject and object are interchangeable across applications.
      CLOSE_MATCH:
        meaning: skos:closeMatch
        description: Similar enough to interchange in some applications; NOT transitive.
      BROAD_MATCH:
        meaning: skos:broadMatch
        description: The object is broader than the subject.
      NARROW_MATCH:
        meaning: skos:narrowMatch
        description: The object is narrower than the subject.
      RELATED_MATCH:
        meaning: skos:relatedMatch
        description: Associatively related, neither equivalence nor hierarchy.
      EQUIVALENT_CLASS:
        meaning: owl:equivalentClass
        description: >-
          Strict logical equivalence; use sparingly and only for
          human-validated mappings intended to license reasoning.

  MappingJustificationEnum:
    description: >-
      How a mapping was produced, drawn from the semapv vocabulary
      (as required by SSSOM).
    permissible_values:
      MANUAL_MAPPING_CURATION:
        meaning: semapv:ManualMappingCuration
        description: Asserted or confirmed by a human curator.
      LEXICAL_MATCHING:
        meaning: semapv:LexicalMatching
        description: String similarity over labels/synonyms.
      SEMANTIC_SIMILARITY_THRESHOLD_MATCHING:
        meaning: semapv:SemanticSimilarityThresholdMatching
        description: Embedding similarity above a threshold.
      STRUCTURAL_MATCHING:
        meaning: semapv:StructuralMatching
        description: Graph-structure evidence (e.g. similarity flooding).
      LOGICAL_REASONING:
        meaning: semapv:LogicalReasoning
        description: Entailed or repaired via logical reasoning.
      COMPOSITE_MATCHING:
        meaning: semapv:CompositeMatching
        description: Ensemble of multiple matching processes.
      UNSPECIFIED_MATCHING:
        meaning: semapv:UnspecifiedMatching
        description: Process unknown (e.g. legacy import).

  ReviewStatusEnum:
    description: Curation lifecycle of a mapping (registry extension).
    permissible_values:
      PROPOSED:
        description: Machine- or human-proposed; not yet reviewed.
      ACCEPTED:
        description: Validated by a reviewer; safe for high-rigor queries.
      REJECTED:
        description: Reviewed and refuted; retained as negative evidence.
      SUPERSEDED:
        description: Replaced by a newer mapping (e.g. after schema re-registration).

  SourceFormatEnum:
    description: Native authoring format of an ingested schema.
    permissible_values:
      LINKML:
      JSON_SCHEMA:
      OWL:
      RDFS:
      SHACL:
      CSV_DATA_DICTIONARY:
      FITS_CONVENTION:
      VOTABLE:
      SQL_DDL:
      OTHER:
